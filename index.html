<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Janala</title>

  <!-- Favicon -->
  <link rel="shortcut icon" href=".//assets/logo.png" type="image/x-icon">

  <!-- Daisy UI + Tailwind CSS -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
    integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <!-- stylesheet  -->
  <link rel="stylesheet" href="style.css">

  <!-- Google FOnt  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet">
</head>

<body>
  <header class="bg-sky-50 shadow-sm">
    <div class="navbar max-w-[1760px] mx-auto ">
      <div class="navbar-start">
        <div class="dropdown">
          <div tabindex="0" role="button" class="btn btn-ghost lg:hidden">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
              stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h8m-8 6h16" />
            </svg>
          </div>
          <ul tabindex="-1" class="menu menu-sm dropdown-content bg-base-100 rounded-box z-1 mt-3 w-52 p-2 shadow">
            <li><a class=""><i class="fa-solid fa-circle-question"></i>FAQ</a></li>
            <li>
              <a href="" class=""><i class="fa-solid fa-book-open"></i>Learn</a>
            </li>
            <li><a class=""><i class="fa-solid fa-arrow-right-from-bracket"></i>Logout</a></li>
          </ul>
        </div>
        <a href="" class="flex gap-1 items-center"><span class="font-bold text-xl">English</span><img
            src="./assets/logo.png" alt=""> <span class="font-bangla font-bold text-xl">জানালা</span></a>
      </div>
      <div class="navbar-end hidden lg:flex">
        <ul class="menu menu-horizontal px-1 gap-2">
          <li><a class=" btn btn-outline btn-primary"><i class="fa-solid fa-circle-question"></i>FAQ</a></li>
          <li>
            <a href="" class="btn btn-outline btn-primary"><i class="fa-solid fa-book-open"></i>Learn</a>
          </li>
          <li><a class="btn btn-outline btn-primary"><i class="fa-solid fa-arrow-right-from-bracket"></i>Logout</a></li>
        </ul>

      </div>
  </header>
  <section class="max-w-[1760px] mx-auto p-5">
    <div class="flex flex-col-reverse  lg:flex-row  justify-between items-center  gap-10">
      <div class="text-center lg:text-left">
        <h2 class="text-4xl font-bold"><span class="text-[#00BCFF]">English</span> is Easy !!</h2>
        <p class="mt-[24px] text-[24px] font-medium ">
          আজ থেকেই আপনার ভাষা শেখার যাত্রা শুরু করুন। আপনি যদি নতুন হন অথবা <br> আপনার দক্ষতা বাড়াতে চান, আমাদের
          Interactive Lessons আপনাকে নিয়ে <br>যাবে অন্য একটি Level এ
        </p>

        <label class="label" for="name"></label>
        <input type="text" id="name" class="input mt-4" placeholder="Type your name" /><br>

        <input type="password" name="password" id="password" class="input mt-3" placeholder="Type your password" /> <br>
        <button class="btn btn-primary mt-4">Get Started</button>
      </div>
      <div>
        <img src="./assets/hero-student.png" alt="">
      </div>

    </div>
  </section>
  <section class="max-w-[1760px] mx-auto p-5">
    <h2 class="text-4xl font-bold text-center"><span class="text-[#00BCFF]">Let's</span> Learn Vocabulary</h2>
    <div class="flex justify-center mt-5 gap-3 flex-wrap" id="lesson-container">
      <!-- <button class="btn btn-outline btn-primary"><i class="fa-solid fa-book-open"></i>Learn</button>  -->
    </div>
  </section>
  <script src="script.js"></script>

</body>

</html>
